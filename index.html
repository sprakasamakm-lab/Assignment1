<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You Are Hacked</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #00ff41;
      font-family: "Courier New", monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: clamp(45px, 10vw, 110px);
      margin: 0;
      color: #ff003c;
      text-shadow:
        0 0 5px #ff003c,
        0 0 20px #ff003c,
        0 0 40px #ff003c;
      animation: glitch 0.8s infinite;
    }

    p {
      font-size: 18px;
      margin-top: 25px;
      color: #00ff41;
      text-shadow: 0 0 10px #00ff41;
    }

    @keyframes glitch {
      0%, 100% {
        transform: translate(0);
      }
      20% {
        transform: translate(-3px, 2px);
      }
      40% {
        transform: translate(3px, -2px);
      }
      60% {
        transform: translate(-2px, -1px);
      }
      80% {
        transform: translate(2px, 1px);
      }
    }

    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 1px,
        transparent 1px,
        transparent 4px
      );
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>YOU ARE HACKED</h1>
    <p>&gt; SYSTEM COMPROMISED_</p>
  </div>

  <div class="scanlines"></div>

</body>
</html>
